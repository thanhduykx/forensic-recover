name: Build Release Artifacts (EXE, APK+JNI, IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build Unsigned iOS Archive (iphoneos)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project ForensicRecoverIOS.xcodeproj \
            -scheme ForensicRecoverIOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ForensicRecoverIOS.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        working-directory: apps/ios
        run: |
          mkdir -p build/Payload
          cp -R build/ForensicRecoverIOS.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r ForensicRecover-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Upload ForensicRecover-iOS-Unsigned-IPA
        uses: actions/upload-artifact@v4
        with:
          name: ForensicRecover-iOS-Unsigned-IPA
          path: apps/ios/build/ForensicRecover-iOS-Unsigned.ipa
          if-no-files-found: error

  build-android-apk-jni:
    name: Build Android APK with Rust JNI (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk & compile librecover_jni.so
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          cargo ndk -t arm64-v8a -t x86_64 -o apps/android/app/src/main/jniLibs build --release -p recover-jni

      - name: Build Android Debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ForensicRecover-Android-JNI-debug.apk

      - name: Upload ForensicRecover-Android-JNI-APK
        uses: actions/upload-artifact@v4
        with:
          name: ForensicRecover-Android-JNI-APK
          path: apps/android/ForensicRecover-Android-JNI-debug.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows CLI & Tauri Desktop EXE (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Desktop Vite Frontend
        working-directory: apps/desktop
        run: |
          npm install
          npm run build

      - name: Build CLI release binary
        run: cargo build --release -p recover-cli

      - name: Build Tauri Desktop release binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --release

      - name: Stage Windows executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item target\release\recover.exe release-win\recover-cli-windows-x64.exe -Force
          Copy-Item apps\desktop\src-tauri\target\release\forensic-recover-tauri.exe release-win\forensic-recover-tauri-windows-x64.exe -Force

      - name: Upload ForensicRecover-Windows-EXE
        uses: actions/upload-artifact@v4
        with:
          name: ForensicRecover-Windows-EXE
          path: release-win/*.exe
          if-no-files-found: error
